ine":567}}}],"source":"import { chromium, Page, Locator } from 'playwright';\nimport { mkdir } from 'fs/promises';\nimport { join, dirname } from 'path';\nimport { DemoConfig, DemoState, DEFAULT_CONFIG } from './types';\nimport { Narration } from './narration';\nimport { concatAudioWithGaps, mergeAudioVideo, detectSyncFrameRange, trimSyncFrames } from './ffmpeg-utils';\nimport { generateSound, initSoundsDir, SoundType, getVariantSoundType } from './sounds';\n\n/**\n * A wrapped page that intercepts click and type operations\n * to record timestamps for UI sounds\n */\nexport class SoundEnabledPage {\n  private originalPage: Page;\n  private recordTimestamp: (type: SoundType) => void;\n  private pendingSoundTimestamps: Array<"+"{ type: SoundType; timeMs: number }>;\n  private state: DemoState;\n\n  constructor(\n    page: Page,\n    recordTimestamp: (type: SoundType) => void,\n    pendingSoundTimestamps: Array<"+"{ type: SoundType; timeMs: number }>,\n    state: DemoState\n  ) {\n    this.originalPage = page;\n    this.recordTimestamp = recordTimestamp;\n    this.pendingSoundTimestamps = pendingSoundTimestamps;\n    this.state = state;\n  }\n\n  private recordTimestampAt(type: SoundType, timeMs: number): void {\n    this.pendingSoundTimestamps.push({ type, timeMs });\n  }\n\n  /**\n   * Navigate to a URL\n   */\n  async goto(url: string): Promise<"+"void> {\n    await this.originalPage.goto(url);\n  }\n\n  /**\n   * Click an element and record the click timestamp\n   * Uses smooth scrolling and human-like reaction delay\n   */\n  async click(selector: string): Promise<"+"void> {\n    // Smooth scroll into view using Playwright's locator\n    const locator = this.originalPage.locator(selector);\n    await locator.scrollIntoViewIfNeeded();\n\n    // Add extra delay to simulate smooth scrolling feel\n    await this.originalPage.waitForTimeout(200);\n\n    // Human reaction delay (100-200ms)\n    await this.originalPage.waitForTimeout(100 + Math.random() * 100);\n\n    this.recordTimestamp('click');\n    await this.originalPage.click(selector);\n  }\n\n  /**\n   * Get the appropriate sound type for a character\n   * Uses round-robin selection for letters and spaces to avoid repetitive sounds\n   */\n  private getSoundTypeForChar(char: string): SoundType {\n    if (char === ' ') return getVariantSoundType('keypress-space');\n    if (char === '\\n' || char === '\\r') return 'keypress-return';\n    return getVariantSoundType('keypress-letter');\n  }\n\n  /**\n   * Calculate variable delay between keypresses for natural typing feel\n   */\n  private getKeypressDelay(prevChar: string, currentChar: string, baseDelay: number): number {\n    let delay = baseDelay;\n\n    // 1. Random variation (+/- 30%)\n    delay *= 0.7 + Math.random() * 0.6;\n\n    // 2. Common digraphs are faster (th, er, on, an, etc.)\n    const fastDigraphs = ['th', 'er', 'on', 'an', 'en', 'in', 're', 'he', 'ed', 'nd'];\n    if (fastDigraphs.includes((prevChar + currentChar).toLowerCase())) {\n      delay *= 0.7;\n    }\n\n    // 3. After space = slight pause (thinking)\n    if (prevChar === ' ') {\n      delay *= 1.3;\n    }\n\n    // 4. Punctuation followed by longer pause\n    if (['.', ',', '!', '?'].includes(prevChar)) {\n      delay *= 1.5;\n    }\n\n    return Math.round(delay);\n  }\n\n  /**\n   * Type text into an element and record keypress timestamps\n   * Uses variable timing for natural feel and different sounds for different keys\n   */\n  async type(selector: string, text: string, options?: { delay?: number }): Promise<"+"void> {\n    await this.originalPage.locator(selector).scrollIntoViewIfNeeded();\n\n    const baseDelay = options?.delay ?? 150; // Default 220ms base for ~45 WPM typing\n\n    for (let i = 0; i <"+" text.length; i++) {\n      const currentChar = text[i];\n      // Stryker disable next-line ConditionalExpression,EqualityOperator,StringLiteral: equivalent mutants — at i === 0 the previous char is a sentinel that only feeds getKeypressDe  at jestAdapter (/Users/mng/Projects/demos-not-memos/node_modules/jest-circus/build/legacy-code-todo-rewrite/jestAdapter.js:79:19)\n    at runTestInternal (/Users/mng/Projects/demos-not-memos/node_modules/jest-runner/build/runTest.js:367:16)\n    at runTest (/Users/mng/Projects/demos-not-memos/node_modules/jest-runner/build/runTest.js:444:34)","status":"Killed","static":false,"testsCompleted":40,"killedBy":["215"],"coveredBy":["213","214","215","216","217","218","219","220","221","222","223","224","225","226","227","228","229","230","231","232","233","234","235","236","237","238","239","240","241","242","243","244","245","246","247","248","249","250","251","252"],"location":{"end":{"column":2,"line":208},"start":{"column":41,"line":205}}},{"id":"573","mutatorName":"BlockStatement","replacement":"{}","statusReason":"src/sounds.ts(213,34): error TS2355: A function whose declared type is neither 'undefined', 'void', nor 'any' must return a value.\n","status":"CompileError","static":false,"coveredBy":["242","244"],"location":{"end":{"column":2,"line":215},"start":{"column":62,"line":213}}}],"source":"import { ElevenLabsClient } from 'elevenlabs';\nimport { createWriteStream, existsSync, mkdirSync, unlinkSync, statSync } from 'fs';\nimport { pipeline } from 'stream/promises';\nimport { join } from 'path';\nimport { execSync } from 'child_process';\nimport { getAudioDuration } from './audio-utils';\n\n/**\n * Target duration for keyboard sounds in seconds.\n * Real MacBook keypresses are 30-80ms, so 100ms is a realistic target.\n * ElevenLabs minimum is 0.5s, so we generate at minimum and trim with ffmpeg.\n */\nconst TARGET_SOUND_DURATION_SECONDS = 0.1;\n\n/**\n * Maximum number of retry attempts when ElevenLabs generates silent audio.\n * Sometimes the AI generates \"duds\" that are entirely silence.\n */\nconst MAX_GENERATION_RETRIES = 3;\n\n/**\n * Minimum file size in bytes for a valid 100ms MP3 sound.\n * A valid 100ms MP3 at reasonable quality should be at least 1KB.\n * Empty/corrupt files from silenceremove are typically ~250 bytes.\n */\nconst MIN_VALID_FILE_SIZE = 1000;\n\n/**\n * Sound effect prompts for ElevenLabs text_to_sound_effects API\n * ASMR-style keyboard sounds with round-robin variants for natural typing\n */\nconst SOUND_PROMPTS = {\n  // MacBook Pro trackpad\n  click: 'MacBook Pro trackpad click, soft satisfying tap, ASMR quality, no background noise, isolated sound',\n\n  // Legacy keypress for backwards compatibility\n  keypress: 'ASMR keyboard key press, satisfying soft thock, MacBook scissor switch, no background noise, isolated sound',\n\n  // Round-robin letter variants - each slightly different character\n  'keypress-letter-1': 'ASMR keyboard key press, soft satisfying thock, gentle attack, MacBook style, no background noise, isolated sound',\n  'keypress-letter-2': 'ASMR keyboard key press, crisp soft tap, light touch, MacBook style, no background noise, isolated sound',\n  'keypress-letter-3': 'ASMR keyboard key press, muted satisfying click, medium touch, MacBook style, no background noise, isolated sound',\n  'keypress-letter-4': 'ASMR keyboard key press, soft thud, deeper tone, MacBook style, no background noise, isolated sound',\n  'keypress-letter-5': 'ASMR keyboard key press, gentle satisfying tap, quick release, MacBook style, no background noise, isolated sound',\n\n  // Round-robin spacebar variants - deeper, more resonant\n  'keypress-space-1': 'ASMR spacebar press, satisfying deep thock, resonant, MacBook style, no background noise, isolated sound',\n  'keypress-space-2': 'ASMR spacebar press, soft deep tap, thumb press, MacBook style, no background noise, isolated sound',\n  'keypress-space-3': 'ASMR spacebar press, muted bass thud, satisfying, MacBook style, no background noise, isolated sound',\n  'keypress-space-4': 'ASMR spacebar press, gentle deep click, centered, MacBook style, no background noise, isolated sound',\n  'keypress-space-5': 'ASMR spacebar press, soft resonant tap, relaxed touch, MacBook style, no background noise, isolated sound',\n\n  // Return key - slightly longer decay\n  'keypress-return': 'ASMR enter key press, satisfying thock, slightly longer decay, MacBook style, no background noise, isolated sound',\n} as const;\n\nexport type SoundType = keyof typeof SOUND_PROMPTS;\n\n// Track last used variant to avoid immediate repetition\nconst lastVariantUsed: Map<"+"string, number> = new Map();\n\n/**\n * Get a round-robin sound type for a base category\n * Ensures we don't play the same variant twice in a row\n */\nexport function getVariantSoundType(baseType: 'keypress-letter' | 'keypress-space'): SoundType {\n  const lastUsed = lastVariantUsed.get(baseType) ?? 0;\n\n  // Pick a random variant that's not the last one used\n  let variant: number;\n  do {\n    variant = Math.floor(Math.random() * 5) + 1;\n  } while (variant === lastUsed);\n\n  lastVariantUsed.set(baseType, variant);\n  return `${baseType}-${variant}` as SoundType;\n}\n\n/**\n * Result of sound generation\n */\nexport interface SoundResult {\n  path: string;\n  durationMs: number;\n}\n\n/**\n * Cache for generated sound effects\n * Stores sounds by type to avoid regenerating the same sounds\n */\nconst soundCache: Map<"+"SoundType, SoundResult> = new Map();\n\n/**\n * Directory where sounds are cached\n */\nlet soundsDir: string | null = null;\n\n/**\n * Initialize the sounds directory for caching\n * Call this before generating any sounds\n */\nexport function initSoundsDir(dir: string): void {\n  soundsDir = dir;\n  if (!existsSync(dir)) {\n    mkdirSync(dir, { recursive: true });\n  }\n}\n\n/**\n * Check if a sound file is valid (not empty/corrupt from silenceremove)\n */\nfunction isValidSoundFile(filePath: string): boolean {\n  try {\n    const stats = statSync(filePath);\n    return stats.size >= MIN_VALID_FILE_SIZE;\n  } catch {\n    return false;\n  }\n}\n\n/**\n * Generate a sound effect using ElevenLabs API\n * Results are cached to avoid duplicate API calls\n */\nexport async function generateSound(type: SoundType): Promise<"+"SoundResult> {\n  // Return cached sound if available\n  const cached = soundCache.get(type);\n  if (cached) {\n    return cached;\n  }\n\n  if (soundsDir === null) {\n    throw new Error('Sounds directory not initialized. Call initSoundsDir() first.');\n  }\n\n  const outputPath = join(soundsDir, `${type}.mp3`);\n\n  // Check if sound file already exists on disk (from previous runs)\n  // Also validate it's not a corrupt file from a previous failed attempt\n  if (existsSync(outputPath) && isValidSoundFile(outputPath)) {\n    const durationMs = await getAudioDuration(outputPath);\n    const result: SoundResult = { path: outputPath, durationMs };\n    soundCache.set(type, result);\n    return result;\n  }\n\n  const client = new ElevenLabsClient();\n  const prompt = SOUND_PROMPTS[type];\n  const tempPath = join(soundsDir, `${type}.temp.mp3`);\n\n  // Retry loop - ElevenLabs sometimes generates \"duds\" (entirely silent audio)\n  for (let attempt = 1; attempt <"+"= MAX_GENERATION_RETRIES; attempt++) {\n    // ElevenLabs minimum duration is 0.5s, so we generate at minimum\n    const audioStream = await client.textToSoundEffects.convert({\n      text: prompt,\n      duration_seconds: 0.5,\n    });\n\n    const writeStream = createWriteStream(tempPath);\n    await pipeline(audioStream, writeStream);\n\n    // Trim to target duration using ffmpeg (real keypresses are 30-80ms)\n    // Use silenceremove to strip leading silence before trimming, since ElevenLabs\n    // may generate sounds where the actual audio content starts later in the file\n    const fadeOutStart = TARGET_SOUND_DURATION_SECONDS * 0.7;\n    const fadeOutDuration = TARGET_SOUND_DURATION_SECONDS * 0.3;\n    execSync(\n      `ffmpeg -y -i \"${tempPath}\" -af \"silenceremove=start_periods=1:start_threshold=-30dB,afade=t=out:st=${fadeOutStart}:d=${fadeOutDuration}\" -t ${TARGET_SOUND_DURATION_SECONDS} \"${outputPath}\"`,\n      { stdio: 'pipe' }\n    );\n\n    // Clean up temp file\n    if (existsSync(tempPath)) {\n      unlinkSync(tempPath);\n    }\n\n    // Validate the output file\n    if (isValidSoundFile(outputPath)) {\n      break; // Success!\n    }\n\n    // Delete invalid file before retry\n    if (existsSync(outputPath)) {\n      unlinkSync(outputPath);\n    }\n\n    if (attempt === MAX_GENERATION_RETRIES) {\n      throw new Error(\n        `Failed to generate valid sound for \"${type}\" after ${MAX_GENERATION_RETRIES} attempts. ` +\n        `ElevenLabs may be generating silent audio for this prompt.`\n      );\n    }\n  }\n\n  const durationMs = await getAudioDuration(outputPath);\n  const result: SoundResult = { path: outputPath, durationMs };\n  soundCache.set(type, result);\n\n  return result;\n}\n\n/**\n * Clear the sound cache (useful for testing)\n */\nexport function clearSoundCache(): void {\n  soundCache.clear();\n  soundsDir = null;\n}\n\n/**\n * Get the current sound cache (useful for testing)\n */\nexport function getSoundCache(): Map<"+"SoundType, SoundResult> {\n  return soundCache;\n}\n"}},"schemaVersion":"1.0","thresholds":{"high":100,"low":100,"break":100},"testFiles":{"tests/unit/demo-builder.test.ts":{"tests":[{"id":"0","name":"NarratedDemo constructor should merge config with defaults","location":{"start":{"column":6,"line":136}}},{"id":"1","name":"NarratedDemo constructor should use provided viewport over default","location":{"start":{"column":6,"line":143}}},{"id":"2","name":"NarratedDemo constructor should use provided voice over default","location":{"start":{"column":6,"line":154}}},{"id":"3","name":"NarratedDemo constructor should use provided model over default","location":{"start":{"column":6,"line":163}}},{"id":"4","name":"NarratedDemo constructor should set temp directory based on output path","location":{"start":{"column":6,"line":172}}},{"id":"5","name":"NarratedDemo page getter should throw error before start() is called","location":{"start":{"column":6 us = process.env.DEMOS_IGNORE_HTTPS_ERRORS;\n      process.env.DEMOS_IGNORE_HTTPS_ERRORS = '1';\n      try {\n        const demo = new NarratedDemo({\n          ...defaultConfig,\n          ignoreHTTPSErrors: false,\n        });\n        await demo.start();\n\n        const mockBrowser = await chromium.launch();\n        expect(mockBrowser.newContext).toHaveBeenCalledWith(\n          expect.objectContaining({ ignoreHTTPSErrors: false })\n        );\n      } finally {\n        if (previous === undefined) {\n          delete process.env.DEMOS_IGNORE_HTTPS_ERRORS;\n        } else {\n          process.env.DEMOS_IGNORE_HTTPS_ERRORS = previous;\n        }\n      }\n    });\n\n    it('should ignore unrecognised DEMOS_IGNORE_HTTPS_ERRORS values', async () => {\n      const previous = process.env.DEMOS_IGNORE_HTTPS_ERRORS;\n      process.env.DEMOS_IGNORE_HTTPS_ERRORS = 'yes';\n      try {\n        const demo = new NarratedDemo(defaultConfig);\n        await demo.start();\n\n        const mockBrowser = await chromium.launch();\n        expect(mockBrowser.newContext).toHaveBeenCalledWith(\n          expect.objectContaining({ ignoreHTTPSErrors: false })\n        );\n      } finally {\n        if (previous === undefined) {\n          delete process.env.DEMOS_IGNORE_HTTPS_ERRORS;\n        } else {\n          process.env.DEMOS_IGNORE_HTTPS_ERRORS = previous;\n        }\n      }\n    });\n\n    it('should navigate to base URL', async () => {\n      const demo = new NarratedDemo(defaultConfig);\n      await demo.start();\n\n      expect(demo.page.goto).toHaveBeenCalledWith('http://localhost:3000');\n    });\n\n    it('should throw error if called twice', async () => {\n      const demo = new NarratedDemo(defaultConfig);\n      await demo.start();\n\n      await expect(demo.start()).rejects.toThrow('Demo already started');\n    });\n\n    it('should set started state and start time', async () => {\n      const demo = new NarratedDemo(defaultConfig);\n      await demo.start();\n\n ls L296/L320 evaluate strings)', async () => {\n      const { chromium } = require('playwright');\n      const demo = new NarratedDemo(defaultConfig);\n      await demo.start();\n\n      const mockBrowser = await chromium.launch();\n      const mockContext = await mockBrowser.newContext();\n      const mockPage = await mockContext.newPage();\n      const calls = (mockPage.evaluate as jest.Mock).mock.calls.map((c: unknown[]) => String(c[0]));\n      // Injection script must contain the magenta marker definition.\n      expect(calls.some((s) => s.includes('sync-marker') && s.includes('#FF00FF'))).toBe(true);\n      // Removal script must reference removing the element by id.\n      expect(calls.some((s) => s.includes(\"getElementById('sync-marker')\") && s.includes('remove'))).toBe(true);\n    });\n\n    it('only creates the SoundEnabledPage wrapper when sounds are enabled (kills L271:9 -> true)', async () => {\n      const demo = new NarratedDemo(defaultConfig); // sounds disabled\n      await demo.start();\n      // If the guard were forced true, demo.page would be a SoundEnabledPage.\n      expect(demo.page).not.toBeInstanceOf(SoundEnabledPage);\n    });\n\n    it('processes sound timestamps only when sounds enabled (kills L446:9 -> true)', async () => {\n      const demo = new NarratedDemo(defaultConfig); // sounds disabled\n      await demo.start();\n      await demo.finish();\n      // If forced true, processSoundTimestamps would run; with no pending it returns early\n      // anyway, so assert generateSound never ran (it also guards behind the same flag chain).\n      expect(soundsModule.generateSound).not.toHaveBeenCalled();\n    });\n\n    it('returns early from processSoundTimestamps when there are no pending sounds (kills L411 guard/block)', async () => {\n      const demo = new NarratedDemo({\n        baseUrl: 'http://localhost:3000',\n        output: '/tmp/output/demo.mp4',\n        sounds: true,\n      });\n      await demo.start();\n      // No clicks/t  0*40 = 0; trimDurationMs = 4*40 = 160; audioOffset = 160 - 0 = 160.\n      expect(ffmpegUtils.concatAudioWithGaps).toHaveBeenCalledWith(\n        expect.any(Array),\n        expect.any(String),\n        160\n      );\n    });\n\n    it('computes syncDurationFrames as last - first + 1 (kills L480 arithmetic)', async () => {\n      // The audioOffset = trimDurationMs - syncFrameOffsetMs uses firstSyncFrame and lastSyncFrame.\n      // syncDurationFrames itself only feeds a console.log, so assert audioOffset which depends on\n      // both frame values, plus the trim frame count, to pin the surrounding arithmetic.\n      (ffmpegUtils.detectSyncFrameRange as jest.Mock).mockResolvedValueOnce({\n        firstSyncFrame: 3,\n        lastSyncFrame: 9,\n        frameDurationMs: 10,\n      });\n      const logSpy = jest.spyOn(console, 'log').mockImplementation(() => undefined);\n\n      const demo = new NarratedDemo(defaultConfig);\n      await demo.start();\n      await demo.narrate('hi');\n      await demo.finish();\n\n      // syncDurationFrames = 9 - 3 + 1 = 7. Mutants: 9-3-1=5, or 9+3=12.\n      const logged = logSpy.mock.calls.map((c) => String(c[0]));\n      expect(logged.some((s) => s.includes('(7 frames)'))).toBe(true);\n    });\n\n    it('logs the timing summary lines (kills L474/L481/L482/L491/L493/L525-528/L530 strings + L529 block)', async () => {\n      (ffmpegUtils.detectSyncFrameRange as jest.Mock).mockResolvedValueOnce({\n        firstSyncFrame: 4,\n        lastSyncFrame: 11,\n        frameDurationMs: 40,\n      });\n      // Pin Date.now so the narration's startTimeMs (Date.now - startTime) is exactly 0.\n      jest.spyOn(Date, 'now').mockReturnValue(1_234_567);\n      const logSpy = jest.spyOn(console, 'log').mockImplementation(() => undefined);\n\n      const demo = new NarratedDemo(defaultConfig);\n      await demo.start();\n      await demo.narrate('hi');\n      await demo.finish();\n\n      const logged = logSpy.mock.calls.map((c) => c.map((a) => String(a)).join(' '));\n      // L474\n      expect(logged.some((s) => s.includes('Detecting sync marker in video'))).toBe(true);\n      // L481 / L482\n      expect(logged.some((s) => s.includes('Sync marker found: frames 4-11'))).toBe(true);\n      expect(logged.some((s) => s.includes('Sync frame offset:'))).toBe(true);\n      // L491\n      expect(logged.some((s) => s.includes('Trimmed') && s.includes('frames'))).toBe(true);\n      // L525-528\n      expect(logged.some((s) => s.includes('Final audio segments'))).toBe(true);\n      expect(logged.some((s) => s.includes('syncFrameOffsetMs:'))).toBe(true);\n      expect(logged.some((s) => s.includes('trimDurationMs:'))).toBe(true);\n      expect(logged.some((s) => s.includes('audioOffset:'))).toBe(true);\n      // L529 block + L530 per-segment string and arithmetic (startTimeMs - audioOffset).\n      // audioOffset = (12*40) - (4*40) = 480 - 160 = 320. The narration segment's startTimeMs\n      // is 0 (narrate fires right at sync in this deterministic setup), so the logged target is\n      // 0 - 320 = -320ms. Mutant startTimeMs + audioOffset would log +320ms.\n      expect(logged.some((s) => s.includes('-> -320ms (duration:'))).toBe(true);\n    });\n\n    it('logs the no-sync-marker message when none detected (kills L493 string)', async () => {\n      // Default detectSyncFrameRange mock returns firstSyncFrame: -1.\n      const logSpy = jest.spyOn(console, 'log').mockImplementation(() => undefined);\n\n      const demo = new NarratedDemo(defaultConfig);\n      await demo.start();\n      await demo.narrate('hi');\n      await demo.finish();\n\n      const logged = logSpy.mock.calls.map((c) => String(c[0]));\n      expect(logged.some((s) => s.includes('No sync marker detected'))).toBe(true);\n      // trimSyncFrames must NOT be called when no marker is found.\n      expect(ffmpegUtils.trimSyncFrames).not.toHaveBeenCalled();\n    });\n\n    it('logs timing markers during start() (kills L283/L288/L306/L313/L321 strings)', async () => {\n      const logSpy = jest.spyOn(console, 'log').mockImplementation(() => undefined);\n\n      const demo = new NarratedDemo(defaultConfig);\n      await demo.start();\n\n      const logged = logSpy.mock.calls.map((c) => c.map((a) => String(a)).join(' '));\n      expect(logged.some((s) => s.includes('Page fully loaded'))).toBe(true);\n      expect(logged.some((s) => s.includes('startTime captured:'))).toBe(true);\n      expect(logged.some((s) => s.includes('Sync marker injected'))).toBe(true);\n      expect(logged.some((s) => s.includes('syncTime captured:'))).toBe(true);\n      expect(logged.some((s) => s.includes('Sync marker removed after 500ms'))).toBe(true);\n    });\n\n    it('logs the per-character SOUND line during type() (kills L117 console string)', async () => {\n      const logSpy = jest.spyOn(console, 'log').mockImplementation(() => undefined);\n\n      const demo = new NarratedDemo({\n        baseUrl: 'http://localhost:3000',\n        output: '/tmp/output/demo.mp4',\n        sounds: true,\n      });\n      await demo.start();\n      const page = demo.page as SoundEnabledPage;\n      await page.type('#in', 'x');\n\n      const logged = logSpy.mock.calls.map((c) => c.map((a) => String(a)).join(' '));\n      expect(logged.some((s) => s.includes('[SOUND]') && s.includes(\"for 'x'\") && s.includes('relative to sync marker'))).toBe(true);\n    });\n  });\n});\n"},"tests/unit/ffmpeg-utils.test.ts":{"tests":[{"id":"134","name":"ffmpeg-utils concatAudioWithGaps should throw error when no segments provided","location":{"start":{"column":6,"line":32}}},{"id":"135","name":"ffmpeg-utils concatAudioWithGaps should build correct ffmpeg command for single segment","location":{"start":{"column":6,"line":38}}},{"id":"136","name":"ffmpeg-utils concatAudioWithGaps should build correct ffmpeg command for multiple segments","location":{"start":{"column":6,"line":62}}},{"id":"137","name":"ffmpeg-utils concatAudioWithGaps should use semicolons to separate filter p stdout: '', stderr: '' });\n    });\n  });\n\n  describe('concatAudioWithGaps', () => {\n    it('should throw error when no segments provided', async () => {\n      await expect(concatAudioWithGaps([], '/output/audio.wav')).rejects.toThrow(\n        'No audio segments provided'\n      );\n    });\n\n    it('should build correct ffmpeg command for single segment', async () => {\n      const mockExec = exec as unknown as jest.Mock;\n      const segments: AudioSegment[] = [\n        {\n          path: '/audio/narration1.mp3',\n          startTimeMs: 0,\n          durationMs: 2000,\n          type: 'narration',\n        },\n      ];\n\n      const result = await concatAudioWithGaps(segments, '/output/combined.wav');\n\n      expect(mockExec).toHaveBeenCalledTimes(1);\n      const command = mockExec.mock.calls[0][0];\n      expect(command).toContain('-i \"/audio/narration1.mp3\"');\n      expect(command).toContain('[0]adelay=0|0,volume=1[a0]');\n      expect(command).toContain('[a0]amix=inputs=1:normalize=0[out]');\n      expect(command).toContain('-map \"[out]\"');\n      expect(command).toContain('\"/output/combined.wav\"');\n      expect(command).toContain('ffmpeg -y');\n      expect(result).toBe('/output/combined.wav');\n    });\n\n    it('should build correct ffmpeg command for multiple segments', async () => {\n      const mockExec = exec as unknown as jest.Mock;\n      const segments: AudioSegment[] = [\n        {\n          path: '/audio/narration1.mp3',\n          startTimeMs: 0,\n          durationMs: 2000,\n          type: 'narration',\n        },\n        {\n          path: '/audio/click.wav',\n          startTimeMs: 2500,\n          durationMs: 100,\n          type: 'click',\n        },\n        {\n          path: '/audio/narration2.mp3',\n          startTimeMs: 3000,\n          durationMs: 3000,\n          type: 'narration',\n        },\n      ];\n\n      await concatAudioWithGaps(segments, '/output/combined.wav');\n\n      const command = mockExec.mock.cal ta, black\n      (readFile as jest.Mock)\n        .mockResolvedValueOnce(blackFrame)\n        .mockResolvedValueOnce(magentaFrame)\n        .mockResolvedValueOnce(magentaFrame)\n        .mockResolvedValueOnce(magentaFrame)\n        .mockResolvedValueOnce(blackFrame);\n\n      const result = await detectSyncFrameRange('/video/test.webm');\n\n      expect(result.firstSyncFrame).toBe(1);\n      expect(result.lastSyncFrame).toBe(3);\n      expect(result.frameDurationMs).toBeCloseTo(33.33, 1);\n    });\n\n    it('should return correct frameDurationMs based on fps', async () => {\n      (readdir as jest.Mock).mockResolvedValue([]);\n\n      const result = await detectSyncFrameRange('/video/test.webm');\n\n      // 30fps = 33.33ms per frame\n      expect(result.frameDurationMs).toBeCloseTo(33.33, 1);\n    });\n\n    it('should handle ffprobe output with denominator of 0', async () => {\n      const mockExec = exec as unknown as jest.Mock;\n      mockExec.mockImplementation((command, callback) => {\n        if (command.includes('ffprobe')) {\n          callback(null, { stdout: '30/0\\n', stderr: '' }); // Invalid denominator\n        } else {\n          callback(null, { stdout: '', stderr: '' });\n        }\n      });\n      (readdir as jest.Mock).mockResolvedValue([]);\n\n      const result = await detectSyncFrameRange('/video/test.webm');\n\n      // Should handle gracefully (30/0 -> uses denominator of 1 -> 30fps)\n      expect(result.frameDurationMs).toBeCloseTo(33.33, 1);\n    });\n\n    // --- Mutation-killing tests for detectSyncFrameRange ---\n\n    it('should create temp dir with recursive:true and sync-range prefix (kills L206:34, L207:24, L207:37)', async () => {\n      // L206:34 StringLiteral 'sync-range-' prefix\n      // L207:24 ObjectLiteral -> {} ; L207:37 BooleanLiteral true -> false\n      (readdir as jest.Mock).mockResolvedValue([]);\n\n      await detectSyncFrameRange('/video/test.webm');\n\n      expect(mkdir).toHaveBeenCalledWith(\n        expect.stringMatching(/sync-range-\\d+/),\n        { recursive: true }\n      );\n    });\n\n    it('should issue exact ffprobe and ffmpeg-extract commands (kills L211/L218 strings)', async () => {\n      // L218:24 StringLiteral / L218:89 StringLiteral frame extraction command + path token\n      const mockExec = exec as unknown as jest.Mock;\n      const calls: string[] = [];\n      mockExec.mockImplementation((command: string, callback: (e: unknown, r: unknown) => void) => {\n        calls.push(command);\n        if (command.includes('ffprobe')) {\n          callback(null, { stdout: '30/1\\n', stderr: '' });\n        } else {\n          callback(null, { stdout: '', stderr: '' });\n        }\n      });\n      (readdir as jest.Mock).mockResolvedValue([]);\n\n      await detectSyncFrameRange('/video/test.webm');\n\n      const probeCmd = calls.find((c) => c.includes('ffprobe'))!;\n      expect(probeCmd).toBe(\n        'ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 \"/video/test.webm\"'\n      );\n      const extractCmd = calls.find((c) => c.startsWith('ffmpeg'))!;\n      expect(extractCmd).toContain('ffmpeg -y -i \"/video/test.webm\" -vframes 60 -q:v 2 \"');\n      expect(extractCmd).toContain('frame-%03d.ppm\"');\n    });\n\n    it('should compute frameDurationMs as num/den with non-unit denominator (kills L214:17 *)', async () => {\n      // L214:17 num / (den||1) -> num * (den||1). '50/2' -> orig fps 25 (40ms); mut* fps 100 (10ms).\n      const mockExec = exec as unknown as jest.Mock;\n      mockExec.mockImplementation((command: string, callback: (e: unknown, r: unknown) => void) => {\n        if (command.includes('ffprobe')) {\n          callback(null, { stdout: '50/2\\n', stderr: '' });\n        } else {\n          callback(null, { stdout: '', stderr: '' });\n        }\n      });\n      (readdir as jest.Mock).mockResolvedValue([]);\n\n      const result = await detectSyncFrameRange('/video/test.webm');\n\n      expect(result.frameDurationMs).toBe(40);\n    });\n\n    it('should only process .ppm files for the range scan (kills L222:24 filter/method, L222:53 string)', async () => {\n      (readdir as jest.Mock).mockResolvedValue(['readme.md', 'frame-001.ppm', 'thumb.jpg']);\n      const ppmHeader = Buffer.from('P6\\n10 10\\n255\\n');\n      const magentaPixels = Buffer.alloc(300);\n      for (let i = 0; i <"+" 300; i += 3) {\n        magentaPixels[i] = 255;\n        magentaPixels[i + 1] = 0;\n        magentaPixels[i + 2] = 255;\n      }\n      const magentaFrame = Buffer.concat([ppmHeader, magentaPixels]);\n      const readFileMock = readFile as jest.Mock;\n      readFileMock.mockResolvedValue(magentaFrame);\n\n      const result = await detectSyncFrameRange('/video/test.webm');\n\n      // Only the single .ppm is scanned -> first=last=0; non-ppm files must not be read.\n      expect(result.firstSyncFrame).toBe(0);\n      expect(result.lastSyncFrame).toBe(0);\n      expect(readFileMock).toHaveBeenCalledTimes(1);\n      expect(readFileMock.mock.calls[0][0]).toContain('frame-001.ppm');\n    });\n\n    it('should scan only .ppm files so lastSyncFrame reflects the .ppm count (kills L222:24 filter removal)', async () => {\n      // L222:24 .filter(f => f.endsWith('.ppm')) removed -> the non-.ppm file (sorted\n      // first as 'extra.txt') would be scanned too, shifting frame indices and read count.\n      // Two contiguous magenta .ppm files plus one non-.ppm file, all returning magenta.\n      (readdir as jest.Mock).mockResolvedValue(['frame-001.ppm', 'frame-002.ppm', 'extra.txt']);\n      const ppmHeader = Buffer.from('P6\\n10 10\\n255\\n');\n      const magentaPixels = Buffer.alloc(300);\n      for (let i = 0; i <"+" 300; i += 3) {\n        magentaPixels[i] = 255;\n        magentaPixels[i + 1] = 0;\n        magentaPixels[i + 2] = 255;\n      }\n      const magentaFrame = Buffer.concat([ppmHeader, magentaPixels]);\n      const readFileMock = readFile as jest.Mock;\n      readFileMock.mockResolvedValue(magentaFrame);\n\n      const result = await detectSyncFrameRange('/video/test.webm');\n\n      // Original: 2 .ppm frames (indices 0,1) -> first=0, last=1, exactly 2 reads.\n      // Mutant (no filter): sorted ['extra.txt','frame-001.ppm','frame-002.ppm'], all\n      // magenta -> first=0, last=2, 3 reads.\n      expect(result.firstSyncFrame).toBe(0);\n      expect(result.lastSyncFrame).toBe(1);\n      expect(readFileMock).toHaveBeenCalledTimes(2);\n      const readPaths = readFileMock.mock.calls.map((c) => c[0] as string);\n      expect(readPaths.some((p) => p.includes('extra.txt'))).toBe(false);\n    });\n\n    it('should sort frame files so order affects the detected range (kills L222:24 .sort() removal)', async () => {\n      // L222:24 .filter(...).sort() with .sort() removed: an unsorted readdir listing\n      // changes the scanned order, shifting firstSyncFrame/lastSyncFrame.\n      // Unsorted listing: frame-001 & frame-002 are magenta, frame-003 is non-magenta.\n      // Original (sorted [001,002,003]): first=0, last=1, then 003 non-magenta with\n      //   firstSyncFrame!=-1 -> break. Result {first:0, last:1}.\n      // Mutant (no sort [003,001,002]): 003 non-magenta (no break, first still -1),\n      //   001 magenta -> first=1, 002 magenta -> last=2. Result {first:1, last:2}.\n      (readdir as jest.Mock).mockResolvedValue(['frame-003.ppm', 'frame-001.ppm', 'frame-002.ppm']);\n\n      const ppmHeader = Buffer.from('P6\\n10 10\\n255\\n');\n      const blackFrame = Buffer.concat([ppmHeader, Buffer.alloc(300, 0)]);\n      const magentaPixels = Buffer.alloc(300);\n      for (let i = 0; i <"+" 300; i += 3) {\n        magentaPixels[i] = 255;\n        magentaPixels[i + 1] = 0;\n        magentaPixels[i + 2] = 255;\n      }\n      const magentaFrame = Buffer.concat([ppmHeader, magentaPixels]);\n\n      // frame-001 and frame-002 magenta; frame-003 non-magenta.\n      (readFile as jest.Mock).mockImplementation((p: string) =>\n        Promise.resolve(\n          p.includes('frame-001.ppm') || p.includes('frame-002.ppm') ? magentaFrame : blackFrame\n        )\n      );\n\n      const result = await detectSyncFrameRange('/video/test.webm');\n\n      // Sorted order: [001(m),002(m),003(black)] -> first=0, last=1 (break at 003).\n      expect(result.firstSyncFrame).toBe(0);\n      expect(result.lastSyncFrame).toBe(1);\n    });\n\n    it('should break after the sync run ends (kills L236:18 conditional-false, L236:41 block)', async () => {\n      // L236:18 else-if condition -> false ; L236:41 block -> {} : both would prevent the\n      // early break, so a later magenta run would be (incorrectly) folded into lastSyncFrame.\n      (readdir as jest.Mock).mockResolvedValue([\n        'frame-001.ppm', 'frame-002.ppm', 'frame-003.ppm', 'frame-004.ppm', 'frame-005.ppm',\n      ]);\n      const ppmHeader = Buffer.from('P6\\n10 10\\n255\\n');\n      const blackFrame = Buffer.concat([ppmHeader, Buffer.alloc(300, 0)]);\n      const magentaPixels = Buffer.alloc(300);\n      for (let i = 0; i <"+" 300; i += 3) {\n        magentaPixels[i] = 255;\n        magentaPixels[i + 1] = 0;\n        magentaPixels[i + 2] = 255;\n      }\n      const magentaFrame = Buffer.concat([ppmHeader, magentaPixels]);\n\n      // magenta, black, then magenta again -> original breaks at the black after the first run.\n      (readFile as jest.Mock)\n        .mockResolvedValueOnce(magentaFrame)\n        .mockResolvedValueOnce(blackFrame)\n        .mockResolvedValueOnce(magentaFrame)\n        .mockResolvedValueOnce(magentaFrame)\n        .mockResolvedValueOnce(magentaFrame);\n\n      const result = await detectSyncFrameRange('/video/test.webm');\n\n      // Original: first=0, last=0 (breaks at frame 1). Without break: last would be 4.\n      expect(result.firstSyncFrame).toBe(0);\n      expect(result.lastSyncFrame).toBe(0);\n    });\n\n    it('should unlink each temp file during cleanup (kills L243/L245/L247 blocks)', async () => {\n      // L243:13 try block, L245:9 for-loop body, L247:33 await unlink block\n      (readdir as jest.Mock)\n        .mockResolvedValueOnce([]) // scan: no frames\n        .mockResolvedValueOnce(['frame-001.ppm', 'frame-002.ppm']); // cleanup listing\n\n      await detectSyncFrameRange('/video/test.webm');\n\n      expect(unlink).toHaveBeenCalledTimes(2);\n      expect((unlink as jest.Mock).mock.calls[0][0]).toContain('frame-001.ppm');\n      expect((unlink as jest.Mock).mock.calls[1][0]).toContain('frame-002.ppm');\n      expect(rmdir).toHaveBeenCalledTimes(1);\n    });\n  });\n\n  describe('trimSyncFrames', () => {\n    beforeEach(() => {\n      jest.clearAllMocks();\n      const mockExec = exec as unknown as jest.Mock;\n      mockExec.mockImplementation((command, callback) => {\n        callback(null, { stdout: '', stderr: '' });\n      });\n    });\n\n    it('should copy video without trimming when framesToTrim is 0', async () => {\n      const mockExec = exec as unknown as jest.Mock;\n\n      await trimSyncFrames('/input/video.webm', '/output/video.mp4', 0, 40);\n\n      const command = mockExec.mock.calls[0][0];\n      expect(command).toContain('ffmpeg -y -i \"/input/video.webm\"');\n      expect(command).toContain('-c:v libx264 -preset fast -crf 23');\n      expect(command).not.toContain('-ss');\n    });\n\n    it('should copy video without trimming when framesToTrim is negative', async () => {\n      const mockExec = exec as unknown as jest.Mock;\n\n      await trimSyncFrames('/input/video.webm', '/output/video.mp4', -5, 40);\n\n      const command = mockExec.mock.calls[0][0];\n      expect(command).not.toContain('-ss');\n    });\n\n    it('should trim video with correct start time', async () => {\n      const mockExec = exec as unknown as jest.Mock;\n\n      // 10 frames at 40ms each = 400ms = 0.4s\n      await trimSyncFrames('/input/video.webm', '/output/video.mp4', 10, 40);\n\n      const command = mockExec.mock.calls[0][0];\n      expect(command).toContain('-ss 0.400');\n      expect(command).toContain('-c:v libx264 -preset fast -crf 23');\n    });\n\n    it('should use correct output path', async () => {\n      const mockExec = exec as unknown as jest.Mock;\n\n      await trimSyncFrames('/input/video.webm', '/my/output/final.mp4', 5, 33.33);\n\n      const command = mockExec.mock.calls[0][0];\n      expect(command).toContain('\"/my/output/final.mp4\"');\n    });\n\n    it('should handle ffmpeg execution error', async () => {\n      const mockExec = exec as unknown as jest.Mock;\n      mockExec.mockImplementation((command, callback) => {\n        callback(new Error('ffmpeg failed'), null);\n      });\n\n      await expect(trimSyncFrames('/input/video.webm', '/output/video.mp4', 5, 40)).rejects.toThrow('ffmpeg failed');\n    });\n\n    // --- Mutation-killing tests for trimSyncFrames ---\n\n    it('should issue the exact copy command when no trimming needed (kills L272 string)', async () => {\n      const mockExec = exec as unknown as jest.Mock;\n\n      await trimSyncFrames('/input/video.webm', '/output/video.mp4', 0, 40);\n\n      const command = mockExec.mock.calls[0][0];\n      expect(command).toBe(\n        'ffmpeg -y -i \"/input/video.webm\" -c:v libx264 -preset fast -crf 23 \"/output/video.mp4\"'\n      );\n    });\n\n    it('should issue the exact trim command with -ss start time (kills L285 string)', async () => {\n      const mockExec = exec as unknown as jest.Mock;\n\n      // 10 frames at 40ms = 400ms = 0.400s\n      await trimSyncFrames('/input/video.webm', '/output/video.mp4', 10, 40);\n\n      const command = mockExec.mock.calls[0][0];\n      expect(command).toBe(\n        'ffmpeg -y -i \"/input/video.webm\" -ss 0.400 -c:v libx264 -preset fast -crf 23 \"/output/video.mp4\"'\n      );\n    });\n\n    it('should log the exact \"Trimming\" message (kills L280:15)', async () => {\n      // L280:15 StringLiteral -> empty would change the trimming log text/values\n      const consoleSpy = jest.spyOn(console, 'log').mockImplementation();\n\n      await trimSyncFrames('/input/video.webm', '/output/video.mp4', 10, 40);\n\n      expect(consoleSpy).toHaveBeenCalledWith('[SYNC] Trimming 10 frames (0.400s) from video');\n\n      consoleSpy.mockRestore();\n    });\n  });\n});\n"},"tests/unit/sounds.test.ts":{"tests":[{"id":"213","name":"sounds initSoundsDir should create directory if it does not exist","location":{"start":{"column":6,"line":52}}},{"id":"214","name":"sounds initSoundsDir should not create directory if it already exists","location":{"start":{"column":6,"line":60}}},{"id":"215","name":"sounds generateSound should throw error if sounds directory not initialized","location":{"start":{"column":6,"line":84}}},{"id":"216","name":"sounds generateSound should generate click sound with correct prompt","location":{"start":{"column":6,"line":91}}},{"id":"217","name":"sounds generateSound should generate keypress sound with correct prompt","location":{"start":{"column":6,"line":109}}},{"id":"218","name":"sounds generateSound should generate keypress-letter-1 sound with correct prompt","location":{"start":{"column":6,"line":127}}},{"id":"219","name":"sounds generateSound should generate keypress-space-1 sound with correct prompt","location":{"start":{"column":6,"line":145}}},{"id":"220","name":"sounds generateSound should generate keypress-return sound with correct prompt","location":{"start":{"column":6,"line":163}}},{"id":"221","name":"sounds generateSound should write audio to temp path before trimming","location":{"start":{"column":6,"line":181}}},{"id":"222","name":"sounds generateSound should return result with correct path and duration","location":{"start":{"column":6,"line":197}}},{"id":"223","name":"sounds generateSound should cache sound result and not regenerate","location":{"start":{"column":6,"line":216}}},{"id":"224","name":"sounds generateSound should load from disk if file exists and is valid","location":{"start":{"column":6,"line":236}}},{"id":"225","name":"sounds generateSound should cache Cache,\n  SoundType,\n  getVariantSoundType,\n} from '../../src/sounds';\nimport { getAudioDuration } from '../../src/audio-utils';\nimport { createWriteStream, existsSync, mkdirSync, unlinkSync, statSync } from 'fs';\nimport { pipeline } from 'stream/promises';\nimport { execSync } from 'child_process';\n\n// Mock dependencies\njest.mock('elevenlabs', () => ({\n  ElevenLabsClient: jest.fn().mockImplementation(() => ({\n    textToSoundEffects: {\n      convert: jest.fn(),\n    },\n  })),\n}));\n\njest.mock('fs', () => ({\n  createWriteStream: jest.fn(),\n  existsSync: jest.fn(),\n  mkdirSync: jest.fn(),\n  unlinkSync: jest.fn(),\n  statSync: jest.fn(),\n}));\n\njest.mock('stream/promises', () => ({\n  pipeline: jest.fn(),\n}));\n\njest.mock('child_process', () => ({\n  execSync: jest.fn(),\n}));\n\njest.mock('../../src/audio-utils', () => ({\n  getAudioDuration: jest.fn(),\n}));\n\nimport { ElevenLabsClient } from 'elevenlabs';\n\ndescribe('sounds', () => {\n  beforeEach(() => {\n    jest.clearAllMocks();\n    clearSoundCache();\n  });\n\n  describe('initSoundsDir', () => {\n    it('should create directory if it does not exist', () => {\n      (existsSync as jest.Mock).mockReturnValue(false);\n\n      initSoundsDir('/path/to/sounds');\n\n      expect(mkdirSync).toHaveBeenCalledWith('/path/to/sounds', { recursive: true });\n    });\n\n    it('should not create directory if it already exists', () => {\n      (existsSync as jest.Mock).mockReturnValue(true);\n\n      initSoundsDir('/path/to/sounds');\n\n      expect(mkdirSync).not.toHaveBeenCalled();\n    });\n  });\n\n  describe('generateSound', () => {\n    const mockAudioStream = { pipe: jest.fn() };\n    const mockWriteStream = { on: jest.fn() };\n\n    beforeEach(() => {\n      (existsSync as jest.Mock).mockReturnValue(false);\n      (createWriteStream as jest.Mock).mockReturnValue(mockWriteStream);\n      (pipeline as jest.Mock).mockResolvedValue(undefined);\n      (getAudioDuration as jest.Mock).mockResolvedValue(100);\n      (execSync as jest.Mock).mockReturnValue(undefined);\n      (unlinkSync as jest.Mock).mockReturnValue(undefined);\n      // Default to valid file size (>1000 bytes)\n      (statSync as jest.Mock).mockReturnValue({ size: 2000 });\n    });\n\n    it('should throw error if sounds directory not initialized', async () => {\n      // Cache is cleared in beforeEach, so soundsDir is null\n      await expect(generateSound('click')).rejects.toThrow(\n        'Sounds directory not initialized. Call initSoundsDir() first.'\n      );\n    });\n\n    it('should generate click sound with correct prompt', async () => {\n      initSoundsDir('/tmp/sounds');\n      const mockConvert = jest.fn().mockResolvedValue(mockAudioStream);\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n\n      await generateSound('click');\n\n      expect(mockConvert).toHaveBeenCalledWith({\n        text: 'MacBook Pro trackpad click, soft satisfying tap, ASMR quality, no background noise, isolated sound',\n        duration_seconds: 0.5,\n      });\n    });\n\n    it('should generate keypress sound with correct prompt', async () => {\n      initSoundsDir('/tmp/sounds');\n      const mockConvert = jest.fn().mockResolvedValue(mockAudioStream);\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n\n      await generateSound('keypress');\n\n      expect(mockConvert).toHaveBeenCalledWith({\n        text: 'ASMR keyboard key press, satisfying soft thock, MacBook scissor switch, no background noise, isolated sound',\n        duration_seconds: 0.5,\n      });\n    });\n\n    it('should generate keypress-letter-1 sound with correct prompt', async () => {\n      initSoundsDir('/tmp/sounds');\n      const mockConvert = jest.fn().mockResolvedValue(mockAudioStream);\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n\n      await generateSound('keypress-letter-1');\n\n      expect(mockConvert).toHaveBeenCalledWith({\n        text: 'ASMR keyboard key press, soft satisfying thock, gentle attack, MacBook style, no background noise, isolated sound',\n        duration_seconds: 0.5,\n      });\n    });\n\n    it('should generate keypress-space-1 sound with correct prompt', async () => {\n      initSoundsDir('/tmp/sounds');\n      const mockConvert = jest.fn().mockResolvedValue(mockAudioStream);\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n\n      await generateSound('keypress-space-1');\n\n      expect(mockConvert).toHaveBeenCalledWith({\n        text: 'ASMR spacebar press, satisfying deep thock, resonant, MacBook style, no background noise, isolated sound',\n        duration_seconds: 0.5,\n      });\n    });\n\n    it('should generate keypress-return sound with correct prompt', async () => {\n      initSoundsDir('/tmp/sounds');\n      const mockConvert = jest.fn().mockResolvedValue(mockAudioStream);\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n\n      await generateSound('keypress-return');\n\n      expect(mockConvert).toHaveBeenCalledWith({\n        text: 'ASMR enter key press, satisfying thock, slightly longer decay, MacBook style, no background noise, isolated sound',\n        duration_seconds: 0.5,\n      });\n    });\n\n    it('should write audio to temp path before trimming', async () => {\n      initSoundsDir('/tmp/sounds');\n      const mockConvert = jest.fn().mockResolvedValue(mockAudioStream);\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n\n      await generateSound('click');\n\n      // Audio is first written to temp path, then ffmpeg trims it\n      expect(createWriteStream).toHaveBeenCalledWith('/tmp/sounds/click.temp.mp3');\n    });\n\n    it('should return result with correct path and duration', async () => {\n      initSoundsDir('/tmp/sounds');\n      const mockConvert = jest.fn().mockResolvedValue(mockAudioStream);\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n      (getAudioDuration as jest.Mock).mockResolvedValue(150);\n\n      const result = await generateSound('click');\n\n      expect(result).toEqual({\n        path: '/tmp/sounds/click.mp3',\n        durationMs: 150,\n      });\n    });\n\n    it('should cache sound result and not regenerate', async () => {\n      initSoundsDir('/tmp/sounds');\n      const mockConvert = jest.fn().mockResolvedValue(mockAudioStream);\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n      (getAudioDuration as jest.Mock).mockResolvedValue(100);\n\n      // First call\n      const result1 = await generateSound('click');\n      // Second call - should use cache\n      const result2 = await generateSound('click');\n\n      expect(mockConvert).toHaveBeenCalledTimes(1);\n      expect(result1).toEqual(result2);\n    });\n\n    it('should load from disk if file exists and is valid', async () => {\n      initSoundsDir('/tmp/sounds');\n      // File exists on disk\n      (existsSync as jest.Mock).mockImplementation((path: string) => {\n        if (path === '/tmp/sounds') return true;\n        if (path === '/tmp/sounds/click.mp3') return true;\n        return false;\n      });\n      // File is valid (>1000 bytes)\n      (statSync as jest.Mock).mockReturnValue({ size: 2000 });\n      (getAudioDuration as jest.Mock).mockResolvedValue(200);\n\n      const mockConvert = jest.fn().mockResolvedValue(mockAudioStream);\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n\n      const result = await generateSound('click');\n\n      // Should not call API\n      expect(mockConvert).not.toHaveBeenCalled();\n      expect(result).toEqual({\n        path: '/tmp/sounds/click.mp3',\n        durationMs: 200,\n      });\n    });\n\n    it('should cache result after loading from disk', async () => {\n      initSoundsDir('/tmp/sounds');\n      (existsSync as jest.Mock).mockImplementation((path: string) => {\n        if (path === '/tmp/sounds') return true;\n        if (path === '/tmp/sounds/keypress.mp3') return true;\n        return false;\n      });\n      // File is valid (>1000 bytes)\n      (statSync as jest.Mock).mockReturnValue({ size: 2000 });\n      (getAudioDuration as jest.Mock).mockResolvedValue(50);\n\n      const mockConvert = jest.fn().mockResolvedValue(mockAudioStream);\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n\n      // First call - loads from disk\n      await generateSound('keypress');\n\n      // Clear the existsSync mock for the second call check\n      (existsSync as jest.Mock).mockReturnValue(false);\n\n      // Second call - should use memory cache\n      const result = await generateSound('keypress');\n\n      expect(mockConvert).not.toHaveBeenCalled();\n      expect(getAudioDuration).toHaveBeenCalledTimes(1); // Only called once\n      expect(result.durationMs).toBe(50);\n    });\n\n    it('should handle API error', async () => {\n      initSoundsDir('/tmp/sounds');\n      const mockConvert = jest.fn().mockRejectedValue(new Error('API rate limit'));\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n\n      await expect(generateSound('click')).rejects.toThrow('API rate limit');\n    });\n\n    it('should handle pipeline error', async () => {\n      initSoundsDir('/tmp/sounds');\n      const mockConvert = jest.fn().mockResolvedValue(mockAudioStream);\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n      (pipeline as jest.Mock).mockRejectedValue(new Error('Write failed'));\n\n      await expect(generateSound('click')).rejects.toThrow('Write failed');\n    });\n\n    it('should retry when generated file is too small (silent audio)', async () => {\n      initSoundsDir('/tmp/sounds');\n      const mockConvert = jest.fn().mockResolvedValue(mockAudioStream);\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n\n      // First two attempts produce invalid (too small) files, third succeeds\n      (statSync as jest.Mock)\n        .mockReturnValueOnce({ size: 250 }) // First attempt: invalid\n        .mockReturnValueOnce({ size: 250 }) // Second attempt: invalid\n        .mockReturnValueOnce({ size: 2000 }); // Third attempt: valid\n\n      // existsSync for temp file cleanup and invalid file deletion\n      let existsCallCount = 0;\n      (existsSync as jest.Mock).mockImplementation((path: string) => {\n        existsCallCount++;\n        // Temp files exist for cleanup, output files exist for deletion on retry\n        if (path.endsWith('.temp.mp3')) return true;\n        if (path.endsWith('.mp3') && existsCallCount > 1) return true;\n        return false;\n      });\n\n      const result = await generateSound('click');\n\n      // Should have called API 3 times due to retries\n      expect(mockConvert).toHaveBeenCalledTimes(3);\n      expect(result.durationMs).toBe(100);\n    });\n\n    it('should throw error after max retries for invalid files', async () => {\n      initSoundsDir('/tmp/sounds');\n      const mockConvert = jest.fn().mockResolvedValue(mockAudioStream);\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n\n      // All attempts produce invalid files\n      (statSync as jest.Mock).mockReturnValue({ size: 250 });\n\n      (existsSync as jest.Mock).mockImplementation((path: string) => {\n        if (path.endsWith('.temp.mp3')) return true;\n        if (path.endsWith('.mp3')) return true;\n        return false;\n      });\n\n      await expect(generateSound('click')).rejects.toThrow(\n        'Failed to generate valid sound for \"click\" after 3 attempts'\n      );\n\n      // Should have retried 3 times\n      expect(mockConvert).toHaveBeenCalledTimes(3);\n    });\n\n    it('should regenerate if cached file on disk is invalid', async () => {\n      initSoundsDir('/tmp/sounds');\n      const mockConvert = jest.fn().mockResolvedValue(mockAudioStream);\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n\n      // File exists on disk but is invalid (too small)\n      (existsSync as jest.Mock).mockImplementation((path: string) => {\n        if (path === '/tmp/sounds') return true;\n        if (path === '/tmp/sounds/click.mp3') return true;\n        if (path.endsWith('.temp.mp3')) return true;\n        return false;\n      });\n\n      // First check shows invalid file, after regeneration it's valid\n      (statSync as jest.Mock)\n        .mockReturnValueOnce({ size: 250 }) // Cached file is invalid\n        .mockReturnValueOnce({ size: 2000 }); // After regeneration, valid\n\n      const result = await generateSound('click');\n\n      // Should have called API to regenerate\n      expect(mockConvert).toHaveBeenCalledTimes(1);\n      expect(result.durationMs).toBe(100);\n    });\n\n    it('should treat file as invalid if statSync throws an error', async () => {\n      initSoundsDir('/tmp/sounds');\n      const mockConvert = jest.fn().mockResolvedValue(mockAudioStream);\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n\n      // File exists on disk but statSync throws (file deleted between checks)\n      (existsSync as jest.Mock).mockImplementation((path: string) => {\n        if (path === '/tmp/sounds') return true;\n        if (path === '/tmp/sounds/click.mp3') return true;\n        if (path.endsWith('.temp.mp3')) return true;\n        return false;\n      });\n\n      // First statSync throws error (file inaccessible), second is valid after regeneration\n      (statSync as jest.Mock)\n        .mockImplementationOnce(() => { throw new Error('ENOENT'); }) // Cached file check fails\n        .mockReturnValueOnce({ size: 2000 }); // After regeneration, valid\n\n      const result = await generateSound('click');\n\n      // Should have called API to regenerate because statSync threw\n      expect(mockConvert).toHaveBeenCalledTimes(1);\n      expect(result.durationMs).toBe(100);\n    });\n\n    it('should call ffmpeg with silenceremove filter', async () => {\n      initSoundsDir('/tmp/sounds');\n      const mockConvert = jest.fn().mockResolvedValue(mockAudioStream);\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n\n      await generateSound('click');\n\n      expect(execSync).toHaveBeenCalledWith(\n        expect.stringContaining('silenceremove=start_periods=1:start_threshold=-30dB'),\n        expect.any(Object)\n      );\n    });\n\n    it('should call ffmpeg with the exact fade-out start derived from the target duration', async () => {\n      // Kills L165:26 ArithmeticOperator: fadeOutStart = TARGET (0.1) * 0.7 = 0.07.\n      // The `/ 0.7` mutant would produce ~0.142857, so we pin the literal `st=0.07`.\n      initSoundsDir('/tmp/sounds');\n      const mockConvert = jest.fn().mockResolvedValue(mockAudioStream);\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n\n      await generateSound('click');\n\n      // The afade filter must use the multiplied (not divided) start time.\n      // 0.1 * 0.7 === 0.06999999999999999; the `/ 0.7` mutant gives ~0.1428.\n      expect(execSync).toHaveBeenCalledWith(\n        expect.stringContaining('afade=t=out:st=0.06999999999999999:'),\n        expect.any(Object)\n      );\n    });\n\n    it('should call ffmpeg with the exact fade-out duration derived from the target duration', async () => {\n      // Kills L166:29 ArithmeticOperator: fadeOutDuration = TARGET (0.1) * 0.3 = 0.03.\n      // The `/ 0.3` mutant would produce ~0.333, so we pin the literal `d=...0.03`.\n      initSoundsDir('/tmp/sounds');\n      const mockConvert = jest.fn().mockResolvedValue(mockAudioStream);\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n\n      await generateSound('click');\n\n      // The afade filter must use the multiplied (not divided) duration.\n      // 0.1 * 0.3 === 0.03; the `/ 0.3` mutant gives ~0.3333.\n      expect(execSync).toHaveBeenCalledWith(\n        expect.stringContaining('d=0.03\"'),\n        expect.any(Object)\n      );\n    });\n\n    it('should call ffmpeg with stdio set to pipe', async () => {\n      // Kills L169:7 ObjectLiteral: the execSync options must be { stdio: 'pipe' }.\n      // The `{}` mutant would drop the stdio option entirely.\n      initSoundsDir('/tmp/sounds');\n      const mockConvert = jest.fn().mockResolvedValue(mockAudioStream);\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n\n      await generateSound('click');\n\n      expect(execSync).toHaveBeenCalledWith(\n        expect.any(String),\n        { stdio: 'pipe' }\n      );\n    });\n\n    it('should not delete temp file when it does not exist after trimming', async () => {\n      // Kills L173:9 ConditionalExpression (-> true): cleanup of the temp file\n      // is guarded by existsSync(tempPath). When the temp file does not exist,\n      // unlinkSync must not be called for it. Forcing the condition to `true`\n      // would call unlinkSync on the (missing) temp path.\n      initSoundsDir('/tmp/sounds');\n      const mockConvert = jest.fn().mockResolvedValue(mockAudioStream);\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n\n      // Nothing exists on disk: no dir, no temp file, no output file.\n      // statSync still reports a valid (2000-byte) file so generation succeeds.\n      (existsSync as jest.Mock).mockReturnValue(false);\n\n      await generateSound('click');\n\n      // Success path with no existing files: nothing should be unlinked.\n      expect(unlinkSync).not.toHaveBeenCalled();\n    });\n\n    it('should delete the invalid output file before retrying when it exists', async () => {\n      // Kills L183:9 ConditionalExpression (-> false) and L183:33 BlockStatement (-> {}):\n      // after an invalid generation, if the output file exists it must be deleted\n      // before the next retry. The `false` / empty-block mutants skip the deletion.\n      initSoundsDir('/tmp/sounds');\n      const mockConvert = jest.fn().mockResolvedValue(mockAudioStream);\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n\n      // statSync calls: attempt 1 post-trim validation (invalid), attempt 2 (valid).\n      // The initial on-disk cache check is skipped because existsSync(outputPath)\n      // is false on the first probe (see counter below).\n      (statSync as jest.Mock)\n        .mockReturnValueOnce({ size: 250 }) // attempt 1: invalid -> triggers delete\n        .mockReturnValueOnce({ size: 2000 }); // attempt 2: valid\n\n      // Output file: absent for the initial disk-cache probe (so we generate),\n      // present for the invalid-file delete guard (so the delete branch runs).\n      // Temp file never exists, so temp cleanup cannot produce a spurious\n      // unlinkSync(outputPath).\n      let mp3Probes = 0;\n      (existsSync as jest.Mock).mockImplementation((path: string) => {\n        if (path === '/tmp/sounds/click.mp3') {\n          mp3Probes++;\n          return mp3Probes > 1; // false on first (disk-cache), true thereafter\n        }\n        return false;\n      });\n\n      await generateSound('click');\n\n      // The invalid output file must have been deleted before retrying.\n      expect(unlinkSync).toHaveBeenCalledWith('/tmp/sounds/click.mp3');\n    });\n\n    it('should not delete the output file on retry when it does not exist', async () => {\n      // Kills L183:9 ConditionalExpression (-> true): the invalid-file delete is\n      // guarded by existsSync(outputPath). When the output file does not exist,\n      // unlinkSync must not be called for it. Forcing the condition to `true`\n      // would unlink the (missing) output path.\n      initSoundsDir('/tmp/sounds');\n      const mockConvert = jest.fn().mockResolvedValue(mockAudioStream);\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n\n      // First attempt invalid, second attempt valid.\n      (statSync as jest.Mock)\n        .mockReturnValueOnce({ size: 250 }) // attempt 1: invalid\n        .mockReturnValueOnce({ size: 2000 }); // attempt 2: valid\n\n      // Neither temp nor output file ever exists on disk.\n      (existsSync as jest.Mock).mockReturnValue(false);\n\n      await generateSound('click');\n\n      // No file existed, so nothing should be unlinked across the retry.\n      expect(unlinkSync).not.toHaveBeenCalled();\n    });\n\n    it('should treat a file exactly at the minimum valid size as valid', async () => {\n      // Kills L115:12 EqualityOperator (>= -> >): MIN_VALID_FILE_SIZE is 1000.\n      // A 1000-byte cached file on disk must be considered valid (>=), so the\n      // API is NOT called. The `>` mutant would treat 1000 as invalid and regenerate.\n      initSoundsDir('/tmp/sounds');\n      (existsSync as jest.Mock).mockImplementation((path: string) => {\n        if (path === '/tmp/sounds') return true;\n        if (path === '/tmp/sounds/click.mp3') return true;\n        return false;\n      });\n      // Exactly at the boundary.\n      (statSync as jest.Mock).mockReturnValue({ size: 1000 });\n      (getAudioDuration as jest.Mock).mockResolvedValue(123);\n\n      const mockConvert = jest.fn().mockResolvedValue(mockAudioStream);\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n\n      const result = await generateSound('click');\n\n      // Boundary file is valid -> loaded from disk, no API call.\n      expect(mockConvert).not.toHaveBeenCalled();\n      expect(result.durationMs).toBe(123);\n    });\n\n    it('should throw the exact failure message after max retries', async () => {\n      // Kills L190:9 StringLiteral (-> ``): the thrown Error message must contain\n      // the full descriptive text. The empty-template mutant would throw an empty message.\n      initSoundsDir('/tmp/sounds');\n      const mockConvert = jest.fn().mockResolvedValue(mockAudioStream);\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n\n      // Every attempt produces an invalid (too-small) file.\n      (statSync as jest.Mock).mockReturnValue({ size: 250 });\n      (existsSync as jest.Mock).mockImplementation((path: string) => {\n        if (path.endsWith('.temp.mp3')) return true;\n        if (path.endsWith('.mp3')) return true;\n        return false;\n      });\n\n      await expect(generateSound('click')).rejects.toThrow(\n        'Failed to generate valid sound for \"click\" after 3 attempts. ' +\n          'ElevenLabs may be generating silent audio for this prompt.'\n      );\n    });\n\n    it('should clean up temp file after trimming', async () => {\n      initSoundsDir('/tmp/sounds');\n      const mockConvert = jest.fn().mockResolvedValue(mockAudioStream);\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n\n      // Temp file exists after generation\n      (existsSync as jest.Mock).mockImplementation((path: string) => {\n        if (path.endsWith('.temp.mp3')) return true;\n        return false;\n      });\n\n      await generateSound('click');\n\n      expect(unlinkSync).toHaveBeenCalledWith('/tmp/sounds/click.temp.mp3');\n    });\n  });\n\n  describe('clearSoundCache', () => {\n    it('should clear the cache', async () => {\n      initSoundsDir('/tmp/sounds');\n      const mockConvert = jest.fn().mockResolvedValue({ pipe: jest.fn() });\n      const mockClient = {\n        textToSoundEffects: {\n          convert: mockConvert,\n        },\n      };\n      (ElevenLabsClient as jest.Mock).mockImplementation(() => mockClient);\n      (existsSync as jest.Mock).mockImplementation((path: string) => {\n        // Temp file exists for cleanup\n        if (path.endsWith('.temp.mp3')) return true;\n        return false;\n      });\n      (createWriteStream as jest.Mock).mockReturnValue({ on: jest.fn() });\n      (pipeline as jest.Mock).mockResolvedValue(undefined);\n      (getAudioDuration as jest.Mock).mockResolvedValue(100);\n      (execSync as jest.Mock).mockReturnValue(undefined);\n      (unlinkSync as jest.Mock).mockReturnValue(undefined);\n      (statSync as jest.Mock).mockReturnValue({ size: 2000 });\n\n      // Generate a sound\n      await generateSound('click');\n      expect(getSoundCache().size).toBe(1);\n\n      // Clear cache\n      clearSoundCache();\n      expect(getSoundCache().size).toBe(0);\n    });\n\n    it('should reset soundsDir to null', async () => {\n      initSoundsDir('/tmp/sounds');\n      clearSoundCache();\n\n      // Should throw because soundsDir is null\n      await expect(generateSound('click')).rejects.toThrow(\n        'Sounds directory not initialized'\n      );\n    });\n  });\n\n  describe('getSoundCache', () => {\n    it('should return the cache map', () => {\n      const cache = getSoundCache();\n      expect(cache).toBeInstanceOf(Map);\n    });\n  });\n\n  describe('getVariantSoundType', () => {\n    it('should return a valid keypress-letter variant', () => {\n      const result = getVariantSoundType('keypress-letter');\n      expect(result).toMatch(/^keypress-letter-[1-5]$/);\n    });\n\n    it('should return a valid keypress-space variant', () => {\n      const result = getVariantSoundType('keypress-space');\n      expect(result).toMatch(/^keypress-space-[1-5]$/);\n    });\n\n    it('should avoid immediate repetition for keypress-letter', () => {\n      // Call multiple times and track results\n      const results: string[] = [];\n      for (let i = 0; i <"+" 20; i++) {\n        results.push(getVariantSoundType('keypress-letter'));\n      }\n\n      // Check that no two consecutive results are the same\n      for (let i = 1; i <"+" results.length; i++) {\n        expect(results[i]).not.toBe(results[i - 1]);\n      }\n    });\n\n    it('should avoid immediate repetition for keypress-space', () => {\n      // Call multiple times and track results\n      const results: string[] = [];\n      for (let i = 0; i <"+" 20; i++) {\n        results.push(getVariantSoundType('keypress-space'));\n      }\n\n      // Check that no two consecutive results are the same\n      for (let i = 1; i <"+" results.length; i++) {\n        expect(results[i]).not.toBe(results[i - 1]);\n      }\n    });\n\n    it('should track letter and space variants independently', () => {\n      // Get a letter variant\n      const letter1 = getVariantSoundType('keypress-letter');\n      // Get a space variant - should be independent\n      const space1 = getVariantSoundType('keypress-space');\n      // Get another letter variant - should avoid letter1, not space1\n      const letter2 = getVariantSoundType('keypress-letter');\n\n      expect(letter2).not.toBe(letter1);\n      // space1 is independent - no assertion needed about its relationship\n      expect(space1).toMatch(/^keypress-space-[1-5]$/);\n    });\n\n    it('should compute the variant index as floor(random*5)+1', () => {\n      // Kills L72:15 ArithmeticOperator (+ 1 -> - 1): with Math.random mocked to 0,\n      // the original computes floor(0*5)+1 = 1 -> 'keypress-letter-1'. The `- 1`\n      // mutant would compute floor(0*5)-1 = -1 -> 'keypress-letter--1'.\n      // isolateModules gives a fresh module so lastVariantUsed starts empty (default 0),\n      // guaranteeing the do/while loop terminates deterministically for index 1.\n      const randomSpy = jest.spyOn(Math, 'random').mockReturnValue(0);\n\n      let result: string | undefined;\n      jest.isolateModules(() => {\n        const fresh = require('../../src/sounds');\n        result = fresh.getVariantSoundType('keypress-letter');\n      });\n\n      expect(result).toBe('keypress-letter-1');\n\n      randomSpy.mockRestore();\n    });\n\n    it('should compute the highest variant index from a near-1 random value', () => {\n      // Reinforces L72:15: Math.random ~0.99 -> floor(0.99*5)+1 = 5 (original),\n      // while the `- 1` mutant would yield floor(0.99*5)-1 = 3.\n      // Fresh module => lastVariantUsed default 0, so index 5 is accepted immediately.\n      const randomSpy = jest.spyOn(Math, 'random').mockReturnValue(0.99);\n\n      let result: string | undefined;\n      jest.isolateModules(() => {\n        const fresh = require('../../src/sounds');\n        result = fresh.getVariantSoundType('keypress-space');\n      });\n\n      expect(result).toBe('keypress-space-5');\n\n      randomSpy.mockRestore();\n    });\n\n    it('should return all variants over many calls (statistical)', () => {\n      const letterVariants = new Set<"+"string>();\n      const spaceVariants = new Set<"+"string>();\n\n      // Run enough times to likely get all variants\n      for (let i = 0; i <"+" 100; i++) {\n        letterVariants.add(getVariantSoundType('keypress-letter'));\n        spaceVariants.add(getVariantSoundType('keypress-space'));\n      }\n\n      // Should have gotten all 5 letter variants\n      expect(letterVariants.size).toBe(5);\n      // Should have gotten all 5 space variants\n      expect(spaceVariants.size).toBe(5);\n    });\n  });\n});\n"},"tests/unit/audio-utils.te
